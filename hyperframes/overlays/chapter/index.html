<!doctype html>
<!-- Chapter: a title card marking a new part of the story ("ATO 1" / "A promessa").
     Data: window.AE_DATA = {kicker, title, accent} (written by auto_edit/hyperframes.py).
     Landscape: card on the right (keeps the face clear). Portrait: card on top (keeps captions clear).
     Root size/duration are rewritten per render to match the edited video. -->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=block" />
    <script src="data.js"></script>
    <style>
      html, body { margin: 0; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: Montserrat, "Segoe UI", Arial, sans-serif; }
      #wrap { position: absolute; inset: 0; display: flex; box-sizing: border-box; }
      @media (min-aspect-ratio: 1/1) { #wrap { align-items: center; justify-content: flex-end; padding-right: 5%; } #card { width: 40%; } }
      @media (max-aspect-ratio: 1/1) { #wrap { align-items: flex-start; justify-content: center; padding-top: 10%; } #card { width: 84%; } }
      #card { box-sizing: border-box; padding: 3vmin 3.6vmin 3.4vmin; border-radius: 2vmin; background: rgba(12, 12, 16, 0.86); box-shadow: 0 1.2vmin 4vmin rgba(0, 0, 0, 0.45); color: #fff; text-align: center; }
      #kicker { display: inline-block; padding: 0.8vmin 2vmin; border-radius: 99px; background: var(--accent); font-weight: 900; font-size: 2.6vmin; letter-spacing: 0.14em; text-transform: uppercase; }
      #title { margin-top: 2vmin; font-weight: 900; font-size: 6.4vmin; line-height: 1.05; }
      #line { height: 0.6vmin; width: 40%; margin: 2.2vmin auto 0; border-radius: 1vmin; background: var(--accent); transform-origin: center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080">
      <div id="wrap"><section id="card" class="clip" data-start="0" data-duration="3"><div id="kicker"></div><div id="title"></div><div id="line"></div></section></div>
    </div>
    <script>
      const d = Object.assign({ kicker: "Ato 1", title: "A promessa", accent: "#FF4500" }, window.AE_DATA || {});
      document.documentElement.style.setProperty("--accent", d.accent);
      document.getElementById("title").textContent = d.title;
      if (d.kicker) document.getElementById("kicker").textContent = d.kicker; else document.getElementById("kicker").remove();

      const total = parseFloat(document.getElementById("root").dataset.duration);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#card", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, 0)
        .fromTo("#kicker", { y: -16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3 }, 0.15)
        .fromTo("#title", { y: 24, opacity: 0, letterSpacing: "0.12em" }, { y: 0, opacity: 1, letterSpacing: "0em", duration: 0.55, ease: "power3.out" }, 0.25)
        .fromTo("#line", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 0.5)
        .to("#card", { opacity: 0, scale: 0.95, duration: 0.35, ease: "power2.in" }, Math.max(1.2, total - 0.4));
      window.__timelines = window.__timelines || {};
      window.__timelines.main = tl;
    </script>
  </body>
</html>
