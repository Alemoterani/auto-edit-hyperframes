<!doctype html>
<!-- Subscribe/follow CTA: pill button that pops in bottom-center, with a click pulse.
     Data: window.AE_DATA = {text, accent} (written by auto_edit/hyperframes.py).
     Root size/duration are rewritten per render to match the edited video. -->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=block" />
    <script src="data.js"></script>
    <style>
      html, body { margin: 0; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: Montserrat, "Segoe UI", Arial, sans-serif; }
      #cta {
        position: absolute; left: 50%; bottom: 10%; transform: translateX(-50%);
        display: flex; align-items: center; gap: 1.6vmin;
        padding: 1.6vmin 3.2vmin; border-radius: 99px; background: var(--accent);
        color: #fff; font-weight: 900; font-size: 4vmin; white-space: nowrap;
        box-shadow: 0 1vmin 3vmin rgba(0, 0, 0, 0.45);
      }
      #bell { width: 4.4vmin; height: 4.4vmin; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <section id="cta" class="clip" data-start="0" data-duration="4">
        <svg id="bell" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3a1.5 1.5 0 0 0-3 0v1.16A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg>
        <span id="label"></span>
      </section>
    </div>
    <script>
      const d = Object.assign({ text: "Se inscreve no canal", accent: "#FF0033" }, window.AE_DATA || {});
      document.getElementById("label").textContent = d.text;
      document.documentElement.style.setProperty("--accent", d.accent);

      const total = parseFloat(document.getElementById("root").dataset.duration);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#cta", { y: 80, opacity: 0, scale: 0.8 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, 0)
        .fromTo("#bell", { rotation: 0 }, { rotation: 18, duration: 0.08, yoyo: true, repeat: 5, transformOrigin: "50% 10%" }, 0.6)
        .to("#cta", { scale: 0.92, duration: 0.1, yoyo: true, repeat: 1 }, 1.3)
        .to("#cta", { y: 80, opacity: 0, duration: 0.35, ease: "power2.in" }, Math.max(1.6, total - 0.4));
      window.__timelines = window.__timelines || {};
      window.__timelines.main = tl;
    </script>
  </body>
</html>
