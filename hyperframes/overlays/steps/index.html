<!doctype html>
<!-- Steps: a numbered list that builds up item by item while the speaker walks through it.
     Data: window.AE_DATA = {title, items: ["...", ...] (2-5), accent} (written by auto_edit/hyperframes.py).
     Landscape: card on the right (keeps the face clear). Portrait: card on top (keeps captions clear).
     Root size/duration are rewritten per render to match the edited video. -->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=block" />
    <script src="data.js"></script>
    <style>
      html, body { margin: 0; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: Montserrat, "Segoe UI", Arial, sans-serif; }
      #wrap { position: absolute; inset: 0; display: flex; box-sizing: border-box; }
      #card { box-sizing: border-box; padding: 3vmin 3.6vmin; border-radius: 2vmin; background: rgba(12, 12, 16, 0.88); box-shadow: 0 1.2vmin 4vmin rgba(0, 0, 0, 0.45); color: #fff; }
      @media (min-aspect-ratio: 1/1) { #wrap { align-items: center; justify-content: flex-end; padding-right: 4%; } #card { width: 42%; } }
      @media (max-aspect-ratio: 1/1) { #wrap { align-items: flex-start; justify-content: center; padding-top: 9%; } #card { width: 86%; } }
      #title { font-weight: 900; font-size: 4.2vmin; line-height: 1.1; margin-bottom: 2.2vmin; }
      .item { display: flex; align-items: center; gap: 2vmin; margin-top: 1.6vmin; font-weight: 700; font-size: 3.4vmin; line-height: 1.2; }
      .num { flex: none; width: 5.4vmin; height: 5.4vmin; border-radius: 50%; display: grid; place-items: center; background: var(--accent); font-weight: 900; font-size: 3vmin; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="wrap"><section id="card" class="clip" data-start="0" data-duration="6"><div id="title"></div><div id="list"></div></section></div>
    </div>
    <script>
      const d = Object.assign({ title: "Passo a passo", items: ["Primeiro", "Segundo", "Terceiro"], accent: "#FF4500" }, window.AE_DATA || {});
      document.documentElement.style.setProperty("--accent", d.accent);
      const title = document.getElementById("title");
      if (d.title) title.textContent = d.title; else title.remove();
      const rows = d.items.slice(0, 5).map((text, i) => {
        const row = document.createElement("div");
        row.className = "item";
        row.innerHTML = '<div class="num"></div><div class="txt"></div>';
        row.querySelector(".num").textContent = i + 1;
        row.querySelector(".txt").textContent = text;
        document.getElementById("list").appendChild(row);
        return row;
      });

      const total = parseFloat(document.getElementById("root").dataset.duration);
      // Spread the items over the first ~70% of the slot so the last one still gets screen time.
      const gap = Math.min(1.2, Math.max(0.25, (total * 0.7 - 0.6) / Math.max(1, rows.length)));
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#card", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0);
      if (d.title) tl.fromTo("#title", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3 }, 0.15);
      rows.forEach((row, i) => {
        const at = 0.5 + i * gap;
        tl.fromTo(row, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, at)
          .fromTo(row.querySelector(".num"), { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2.5)" }, at);
      });
      tl.to("#card", { opacity: 0, y: -30, duration: 0.35, ease: "power2.in" }, Math.max(1, total - 0.4));
      window.__timelines = window.__timelines || {};
      window.__timelines.main = tl;
    </script>
  </body>
</html>
